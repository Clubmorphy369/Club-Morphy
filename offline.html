<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión - Club Morphy</title>
  <style>
    body { font-family: 'Lato', sans-serif; text-align: center; padding: 40px; background: #f1f5f9; color: #1e293b; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
    h1 { color: #0ea5e9; }
    .icon { font-size: 4rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Sin conexión a Internet</h1>
    <p>Parece que no tienes acceso a la red. Por favor, revisa tu conexión y vuelve a intentarlo.</p>
    <button onclick="location.reload()" style="padding:12px 24px; background:#0ea5e9; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Reintentar</button>
  </div>
</body>
</html>
