<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Sin conexión — Club Morphy</title>
  <link rel="icon" type="image/png" href="./assets/logo-club.png">
  <style>
    :root {
      --acento: #0ea5e9;
      --acento-oscuro: #0284c7;
      --bg: #f1f5f9;
      --texto: #1e293b;
      --texto-suave: #64748b;
      --surface: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      text-align: center;
      padding: 24px;
      background: var(--bg);
      color: var(--texto);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: var(--surface);
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      border-top: 3px solid var(--acento);
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 16px;
      border: 2px solid var(--acento);
      background: var(--bg);
      display: block;
    }
    .icon { font-size: 4rem; line-height: 1; margin: 8px 0; }
    h1 {
      color: var(--acento);
      margin: 12px 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.6rem;
      letter-spacing: 0.3px;
    }
    p {
      color: var(--texto-suave);
      line-height: 1.6;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }
    button {
      padding: 12px 28px;
      background: var(--acento);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      min-height: 44px;
      min-width: 44px;
      font-family: inherit;
    }
    button:hover:not(:disabled) { background: var(--acento-oscuro); }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #estado {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--texto-suave);
      min-height: 1.2em;
    }
    #estado.online { color: #16a34a; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="./assets/logo-club.png"
         alt="Club Morphy" onerror="this.style.display='none'">
    <div class="icon">📡</div>
    <h1>Sin conexión</h1>
    <p>
      <strong>Club Morphy</strong> no puede cargar el contenido sin Internet.
      Revisa tu conexión y vuelve a intentarlo.
    </p>
    <button id="retry-btn" onclick="reintentar()">Reintentar</button>
    <p id="estado">Comprobando conexión...</p>
  </div>

  <script>
    function reintentar() {
      const btn = document.getElementById('retry-btn');
      btn.disabled = true;
      btn.textContent = 'Reintentando...';
      location.reload();
    }

    const estado = document.getElementById('estado');

    function actualizarEstado() {
      if (navigator.onLine) {
        estado.textContent = '✅ Conexión restaurada. Recargando...';
        estado.classList.add('online');
        setTimeout(() => location.reload(), 1200);
      } else {
        estado.textContent = 'Sin conexión. Esperando red...';
        estado.classList.remove('online');
      }
    }

    window.addEventListener('online', actualizarEstado);
    window.addEventListener('offline', actualizarEstado);

    if (navigator.onLine) {
      actualizarEstado();
    } else {
      estado.textContent = 'Sin conexión. Esperando red...';
    }
  </script>
</body>
</html>
