name: Deploy to Firebase Hosting and Firestore

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'offline.html'
      - 'styles-base.css'
      - 'styles-layout.css'
      - 'styles-componentes.css'
      - 'styles-curso.css'
      - 'styles-extras.css'
      - 'styles-responsive.css'
      - 'entrenador.css'
      - 'entrenador-responsive.css'
      - 'sw.js'
      - 'manifest.json'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'entrenador-core.js'
      - 'entrenador-tablero.js'
      - 'entrenador-api.js'
      - 'script-core.js'
      - 'script-curso.js'
      - 'script-render.js'
      - 'script-main.js'
      - 'assets/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLUB_MORPHY }}'
          project_id: club-morphy-6aa5c

            - name: Verify critical files
        run: |
          test -f index.html || (echo "Falta index.html" && exit 1)
          test -f offline.html || (echo "Falta offline.html" && exit 1)
          test -f sw.js || (echo "Falta sw.js" && exit 1)
          test -f manifest.json || (echo "Falta manifest.json" && exit 1)
          test -f firebase.json || (echo "Falta firebase.json" && exit 1)
          test -f firestore.rules || (echo "Falta firestore.rules" && exit 1)
          test -f firestore.indexes.json || (echo "Falta firestore.indexes.json" && exit 1)
          test -f styles-base.css || (echo "Falta styles-base.css" && exit 1)
          test -f styles-layout.css || (echo "Falta styles-layout.css" && exit 1)
          test -f styles-componentes.css || (echo "Falta styles-componentes.css" && exit 1)
          test -f styles-curso.css || (echo "Falta styles-curso.css" && exit 1)
          test -f styles-extras.css || (echo "Falta styles-extras.css" && exit 1)
          test -f styles-responsive.css || (echo "Falta styles-responsive.css" && exit 1)
          test -f entrenador.css || (echo "Falta entrenador.css" && exit 1)
          test -f entrenador-responsive.css || (echo "Falta entrenador-responsive.css" && exit 1)
          test -f entrenador-core.js || (echo "Falta entrenador-core.js" && exit 1)
          test -f entrenador-tablero.js || (echo "Falta entrenador-tablero.js" && exit 1)
          test -f entrenador-api.js || (echo "Falta entrenador-api.js" && exit 1)
          test -f script-core.js || (echo "Falta script-core.js" && exit 1)
          test -f script-curso.js || (echo "Falta script-curso.js" && exit 1)
          test -f script-render.js || (echo "Falta script-render.js" && exit 1)
          test -f script-main.js || (echo "Falta script-main.js" && exit 1)
          test -f assets/lozza/lozza.js || (echo "Falta assets/lozza/lozza.js" && exit 1)
          echo "OK: Todos los archivos criticos presentes"
          
      - name: Deploy to Firebase
        run: |
          npx firebase-tools@13 deploy \
            --only hosting,firestore:rules,firestore:indexes \
            --project club-morphy-6aa5c \
            --non-interactive \
            --force

      - name: Notify success
        if: success()
        run: |
          echo "Deploy exitoso"
          echo "Hosting: https://club-morphy-6aa5c.web.app"

      - name: Notify failure
        if: failure()
        run: echo "Deploy fallo. Revisa los logs arriba."
