name: Deploy to Firebase Hosting and Firestore

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'offline.html'
      - 'script.js'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.json'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'assets/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLUB_MORPHY }}'
          project_id: club-morphy-6aa5c

      - name: Verify critical files
        run: |
          test -f index.html || (echo "❌ Falta index.html" && exit 1)
          test -f script.js || (echo "❌ Falta script.js" && exit 1)
          test -f sw.js || (echo "❌ Falta sw.js" && exit 1)
          test -f manifest.json || (echo "❌ Falta manifest.json" && exit 1)
          test -f firebase.json || (echo "❌ Falta firebase.json" && exit 1)
          test -f firestore.rules || (echo "❌ Falta firestore.rules" && exit 1)
          test -f firestore.indexes.json || (echo "❌ Falta firestore.indexes.json" && exit 1)
          echo "✅ Todos los archivos críticos presentes"

      - name: Deploy to Firebase
        run: |
          npx firebase-tools@13 deploy \
            --only hosting,firestore:rules,firestore:indexes \
            --project club-morphy-6aa5c \
            --non-interactive \
            --force

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deploy exitoso"
          echo "🌐 Hosting: https://club-morphy-6aa5c.web.app"
          echo "📋 Reglas: https://console.firebase.google.com/project/club-morphy-6aa5c/firestore/rules"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy falló. Revisa los logs arriba."
